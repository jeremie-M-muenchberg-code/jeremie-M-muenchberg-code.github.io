  <rect x="60" y="10" width="2.6" height="4" rx="0.8" fill="#5c52a8" transform="rotate(-20 61.3 12)"/>
  <rect x="6" y="28" width="2.4" height="3.6" rx="0.7" fill="#6b2d5b" transform="rotate(-35 7.2 29.8)"/>
  <rect x="70" y="30" width="2.4" height="3.6" rx="0.7" fill="#8a4576" transform="rotate(32 71.2 31.8)"/>
  <!-- Kirby-style stub arms UP (simple ellipses, no twist) -->
  <ellipse cx="18" cy="28" rx="9" ry="7.5" fill="#6b2d5b" stroke="#4a1d3e" stroke-width="1.4" transform="rotate(-38 18 28)"/>
  <ellipse cx="62" cy="28" rx="9" ry="7.5" fill="#6b2d5b" stroke="#4a1d3e" stroke-width="1.4" transform="rotate(38 62 28)"/>
  <!-- Leaf -->
  <path fill="#3d6b42" d="M44 8c7 1 13 7 13.5 14-7 0-13.5-4.5-16-12.5 1-.9 1.6-1.5 2.5-1.5z"/>
  <path fill="none" stroke="#3a1830" stroke-width="2" stroke-linecap="round" d="M40 22c.8-4.5 2.5-8.5 6.5-11.5"/>
  <!-- Round plum body (Kirby ball) -->
  <circle cx="40" cy="46" r="22" fill="#6b2d5b"/>
  <circle cx="40" cy="46" r="22" fill="none" stroke="#4a1d3e" stroke-width="1.5"/>
  <ellipse cx="32" cy="38" rx="8" ry="10" fill="#8a4576" opacity=".55"/>
  <ellipse cx="30" cy="36" rx="4.5" ry="6" fill="#f7eef3" opacity=".35"/>
  <!-- Tiny Kirby feet -->
  <ellipse cx="32" cy="68" rx="7" ry="4.2" fill="#6b2d5b" stroke="#4a1d3e" stroke-width="1.2"/>
  <ellipse cx="48" cy="68" rx="7" ry="4.2" fill="#6b2d5b" stroke="#4a1d3e" stroke-width="1.2"/>
  <!-- Face -->
  <ellipse cx="33" cy="44" rx="3.2" ry="5.2" fill="#1e1838"/>
  <ellipse cx="47" cy="44" rx="3.2" ry="5.2" fill="#1e1838"/>
  <ellipse cx="34" cy="42.2" rx="1.1" ry="1.6" fill="#f7f2fc" opacity=".65"/>
  <ellipse cx="48" cy="42.2" rx="1.1" ry="1.6" fill="#f7f2fc" opacity=".65"/>
  <ellipse cx="29" cy="50" rx="3.2" ry="1.8" fill="#c45a8c" opacity=".55"/>
  <ellipse cx="51" cy="50" rx="3.2" ry="1.8" fill="#c45a8c" opacity=".55"/>
  <ellipse cx="40" cy="54" rx="4.5" ry="3.2" fill="#1e1838"/>
  <ellipse cx="40" cy="53.2" rx="3.2" ry="1.6" fill="#4a1d3e"/>
