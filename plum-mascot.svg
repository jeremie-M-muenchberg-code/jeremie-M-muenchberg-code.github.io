<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Plum">
  <!-- Confetti -->
  <circle cx="10" cy="18" r="1.8" fill="#5c52a8"/>
  <circle cx="70" cy="16" r="1.6" fill="#e8b84a"/>
  <circle cx="8" cy="42" r="1.4" fill="#8a4576"/>
  <circle cx="72" cy="40" r="1.5" fill="#3d6b42"/>
